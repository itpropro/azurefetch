name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      package_file: ${{ steps.pack.outputs.package_file }}
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main

          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Set up npm
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: bunx oxfmt --check . '!CHANGELOG.md'

      - name: Lint
        run: |
          bun run lint
          bun run lint:type

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Edge-runtime smoke test
        run: bun run test:edge-smoke

      - name: Pack
        id: pack
        shell: bash
        env:
          PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/npm-package
        run: |
          set -euo pipefail

          mkdir "$PACKAGE_OUTPUT_DIR"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$PACKAGE_OUTPUT_DIR")"
          package_file="$(jq -er 'to_entries | select(length == 1) | .[0].value.filename' <<< "$pack_json")"
          expected_version="${RELEASE_TAG#v}"
          expected_file="azurefetch-${expected_version}.tgz"

          test "$package_file" = "$expected_file"
          jq -e '
            to_entries
            | select(length == 1)
            | .[0].value
            | .name == "azurefetch"
            and ([.files[].path | select(
              . != "README.md"
              and . != "package.json"
              and (startswith("dist/") | not)
            )] | length == 0)
            and ([.files[].path] | index("README.md") != null)
            and ([.files[].path] | index("package.json") != null)
            and ([.files[].path | select(startswith("dist/"))] | length > 0)
          ' <<< "$pack_json" > /dev/null

          package_path="$PACKAGE_OUTPUT_DIR/$package_file"
          test -f "$package_path"
          test "$(find "$PACKAGE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.tgz' -printf . | wc -c)" -eq 1

          package_sha256="$(sha256sum "$package_path" | awk '{print $1}')"
          [[ "$package_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$package_sha256" "$package_file" > "$package_path.sha256"

          test "$(find "$PACKAGE_OUTPUT_DIR" -maxdepth 1 -type f -printf . | wc -c)" -eq 2
          test -z "$(find "$PACKAGE_OUTPUT_DIR" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-package/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      EXPECTED_PACKAGE_FILE: ${{ needs.build.outputs.package_file }}
      EXPECTED_PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
    steps:
      - name: Validate artifact reference
        shell: bash
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_PACKAGE_FILE" = "azurefetch-${RELEASE_TAG#v}.tgz"

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/npm-package
          merge-multiple: true
          digest-mismatch: error

      - name: Verify package artifact
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/npm-package"
          package_path="$package_dir/$EXPECTED_PACKAGE_FILE"
          manifest_path="$package_path.sha256"

          test -f "$package_path"
          test -f "$manifest_path"
          test "$(find "$package_dir" -maxdepth 1 -type f -printf . | wc -c)" -eq 2
          test -z "$(find "$package_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

          read -r manifest_digest manifest_file manifest_extra < "$manifest_path"
          [[ "$manifest_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$manifest_digest" = "$EXPECTED_PACKAGE_SHA256"
          test "$manifest_file" = "$EXPECTED_PACKAGE_FILE"
          test -z "${manifest_extra:-}"

          actual_digest="$(sha256sum "$package_path" | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_PACKAGE_SHA256"

          mapfile -t package_entries < <(tar -tzf "$package_path")
          test "${#package_entries[@]}" -gt 0
          test "$(printf '%s\n' "${package_entries[@]}" | grep -c '^package/package\.json$')" -eq 1
          tar -tvzf "$package_path" | awk '$1 !~ /^-/ { exit 1 }'

          for entry in "${package_entries[@]}"; do
            [[ "$entry" != /* ]]
            [[ "$entry" != ../* ]]
            [[ "$entry" != *'/../'* ]]
            [[ "$entry" != *'/./'* ]]
            case "$entry" in
              package/README.md | package/package.json | package/dist/*) ;;
              *)
                echo "Unexpected package entry: $entry" >&2
                exit 1
                ;;
            esac
          done

          package_name="$(tar -xOf "$package_path" package/package.json | jq -er '.name')"
          package_version="$(tar -xOf "$package_path" package/package.json | jq -er '.version')"
          test "$package_name" = "azurefetch"
          test "$package_version" = "${RELEASE_TAG#v}"

          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Set up npm
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Stage package
        env:
          PACKAGE_PATH: ${{ steps.verify.outputs.package_path }}
        run: npm stage publish "$PACKAGE_PATH" --access public --provenance --ignore-scripts

      - name: Summarize staged package
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## npm package staged"
            echo
            echo "- Package: \`azurefetch@${RELEASE_TAG#v}\`"
            echo "- Source tag: \`$RELEASE_TAG\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Package SHA-256: \`$EXPECTED_PACKAGE_SHA256\`"
            echo
            echo "Review the staged metadata and downloaded tarball, then approve or reject with npm 2FA."
          } >> "$GITHUB_STEP_SUMMARY"
